<script>
        // Simple interactive script for the stars (visual only for mockup)
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('#star-rating button span');
            const ratingText = document.querySelector('#star-rating + p');
            const texts = ["Terrible", "Could be better", "Okay", "Good", "Excellent!"];

            stars.forEach((star, index) => {
                star.parentElement.addEventListener('click', () => {
                    stars.forEach((s, i) => {
                        if (i <= index) {
                            s.classList.add('star-filled');
                            s.classList.remove('text-outline-variant');
                        } else {
                            s.classList.remove('star-filled');
                            s.classList.add('text-outline-variant');
                        }
                    });
                    if(ratingText) {
                        ratingText.textContent = `"${texts[index]}"`;
                    }
                });
            });
            
            // Toggle Logic visual fix
            const toggle = document.getElementById('anonymous-toggle');
            const toggleLabel = document.querySelector('.toggle-label');
            toggle.addEventListener('change', function() {
                if(this.checked) {
                    this.style.transform = 'translateX(100%)';
                    this.style.borderColor = '#52C41A';
                    toggleLabel.style.backgroundColor = '#52C41A';
                } else {
                    this.style.transform = 'translateX(0)';
                    this.style.borderColor = '#c6c6cf';
                    toggleLabel.style.backgroundColor = '#e4e1e6';
                }
            });
        });
    </script>
